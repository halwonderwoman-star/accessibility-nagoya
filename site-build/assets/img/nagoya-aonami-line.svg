<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1400" viewBox="0 0 2000 1400" lang="en" role="img" aria-labelledby="title desc">
<title id="title">Nagoya Station — Aonami Line</title>
<desc id="desc">Three gates: JR at lower left, Aonami to its right, and a vertical JR to Aonami transfer gate on the boundary above. First-floor facilities from left to right: stairs, escalator, accessible toilet with baby care and ostomate facilities, toilets, elevator. Between Platforms 1 and 2: stairs, escalator, elevator at far right.</desc>
