<title id="title">Kanayama Station South Exit — Taxi and Bus Stops</title><desc id="desc">North-up schematic. Taxi stand is ahead to the left on leaving the south exit. City bus stops 1 and 2 are south of the plaza, with stop 2 across the road to the southeast. Nippon Chuo highway bus stop is just west of city bus stop 1. JR highway bus stop is farther west. Dashed arrows show schematic walking directions.</desc>
